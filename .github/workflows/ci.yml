name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack & install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm run build

      - name: Typecheck SDK
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test
